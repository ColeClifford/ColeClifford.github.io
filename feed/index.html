<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feed — Cole Clifford</title>
  <meta name="description" content="Articles, posts, and updates from Cole Clifford.">
  <link rel="stylesheet" href="../css/style.css">
  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
</head>
<body>

  <!-- Nav -->
  <nav class="nav">
    <div class="container nav__inner">
      <a href="/" class="nav__logo">Cole Clifford</a>
      <button class="nav__hamburger" aria-label="Toggle navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <ul class="nav__links">
        <li><a href="/">Home</a></li>
        <li><a href="/#projects">Projects</a></li>
        <li><a href="/#experience">Experience</a></li>
        <li>
          <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Feed Page -->
  <div class="container">
    <div class="feed-page-header">
      <h1>Feed</h1>
      <p style="color: var(--text-secondary); margin-top: 8px;">Articles, posts, and updates.</p>
    </div>

    <div class="filter-bar" id="feed-filter-bar" style="margin-bottom: 32px;"></div>
    <div id="feed-grid"></div>
  </div>

  <!-- Footer -->
  <footer class="footer" style="margin-top: 80px;">
    <div class="container">
      <p>&copy; <span id="year"></span> Cole Clifford. Built with care.</p>
    </div>
  </footer>

  <script src="../js/main.js"></script>
</body>
</html>
